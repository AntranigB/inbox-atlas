<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Inbox Atlas</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <meta name="theme-color" content="#f4efe4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#12161a" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Atlas">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <script src="auth.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="13" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="16" cy="16" r="8" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="2 2"/><path d="M16 3v6M16 23v6M3 16h6M23 16h6" stroke="currentColor" stroke-width="1.5"/><circle cx="16" cy="16" r="2.2" fill="var(--accent)"/></svg>
      <div>
        <h1>Inbox Atlas</h1>
        <p class="tag">your mail as a map. queries as regions.</p>
      </div>
    </div>
    <div class="status" id="status">connecting</div>
  </header>

  <section class="searchbar">
    <form id="search-form" autocomplete="off">
      <input id="q" type="search" placeholder="try: coding competition, money I owe someone, travel plans" aria-label="Search your inbox">
      <div id="voice-slot"></div>
      <button type="submit" class="go">Search</button>
    </form>
    <div class="controls">
      <div class="seg" id="mode" role="tablist" aria-label="Search mode">
        <button data-mode="keyword">Keyword</button>
        <button data-mode="embed">Embedding</button>
        <button data-mode="region" class="on">Region</button>
      </div>
      <div class="seg" id="encoder" hidden aria-label="Encoder"></div>
    </div>
    <div class="demo-row" id="demo-row" aria-label="Example searches">
      <span class="demo-label">try</span>
      <button type="button" class="demo-q">coding competition</button>
      <button type="button" class="demo-q">money I owe someone</button>
      <button type="button" class="demo-q">yacht maintenance</button>
      <button type="button" class="demo-q">travel plans</button>
    </div>
    <div class="verdict-row">
      <div id="verdict" class="verdict" hidden></div>
      <div id="tokens" class="tokens" hidden title="What an agent would read: POST /api/context returns this answer pack, budget 800 tokens"></div>
      <div id="chips" class="chips"></div>
    </div>
  </section>

  <main class="grid">
    <section class="panel results-panel">
      <div class="panel-head"><h2>Results</h2><span id="result-meta" class="meta"></span></div>
      <ol id="results" class="results"><li class="empty">Search to place a region on your inbox.</li></ol>
    </section>

    <section class="panel map-panel">
      <div class="panel-head"><h2>Map</h2><span id="map-meta" class="meta"></span>
        <button id="map-reset" class="ghost" title="Reset view">reset</button></div>
      <div class="map-wrap">
        <canvas id="map"></canvas>
        <div id="map-tip" class="tip" hidden></div>
        <div id="map-empty" class="map-empty" hidden>index not built</div>
      </div>
      <div id="legend" class="legend"></div>
    </section>

    <section class="panel chat-panel">
      <div class="panel-head"><h2>Ask Grok</h2><span class="meta">tools: search_region, is_related, agenda</span></div>
      <div class="sessions">
        <select id="session-pick" aria-label="Chat session"><option value="">New chat</option></select>
        <button id="session-new" class="ghost" type="button" title="Start a new chat">new</button>
      </div>
      <div id="chat-log" class="chat-log">
        <div class="msg bot">Ask anything about your inbox. Try "what do I have Sunday?" or "did anyone ask me for money?"</div>
      </div>
      <form id="chat-form" class="chat-form" autocomplete="off">
        <input id="chat-in" placeholder="Ask about your inbox" aria-label="Ask about your inbox">
        <button type="submit">Ask</button>
      </form>
    </section>
  </main>

  <script src="app.js"></script>
  <script src="voice.js"></script>
</body>
</html>
